<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Integrity-Box</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
<style>
</style>
</head>
<body>
  <div class="container">
    <header class="title-bar">
      <div id="module-name" class="title">𝙋𝙡𝙖𝙮 𝙄𝙣𝙩𝙚𝙜𝙧𝙞𝙩𝙮 𝘽𝙤𝙭</div>
      <div class="subtitle">万人嫌，但无人能敌</div>
    </header>

	<!-- Dashboard -->
    <div class="dashboard">
      <div class="status-item">配置文件: <span id="status-profile" class="status-indicator loading">...</span></div>
      <div class="status-item">应用商店: <span id="status-playstore" class="status-indicator loading">...</span></div>
      <div class="status-item">Lineage: <span id="status-LineageProp" class="status-indicator loading">...</span></div>
      <div class="status-item">欺骗状态: <span id="status-gms" class="status-indicator loading">...</span></div>
      <div class="status-item">欺骗型号: <span id="status-pixel" class="status-indicator loading">...</span></div>
      <div class="status-item">补丁日期: <span id="status-patch" class="status-indicator loading">...</span></div>
      <div class="status-item">SELinux: <span id="status-selinux" class="status-indicator loading">...</span></div>
      <div class="status-item">目标数量: <span id="status-target" class="status-indicator loading">...</span></div>
      <div class="status-item">安卓版本: <span id="status-android" class="status-indicator loading">...</span></div>
      <div class="status-item">Zygote: <span id="status-zygisk" class="status-indicator loading">...</span></div>
      <div class="status-item">名单模式: <span id="status-whitelist" class="status-indicator loading">...</span></div>
      <div class="status-item">自动驾驶: <span id="status-autopilot" class="status-indicator loading">...</span></div>
    </div>

    <!-- Buttons -->
    <main>
            <div class="button-group">
        <h3 class="group-title">杂项设置</h3>
        <div class="button-grid">
          <button class="btn" data-type="flags"><span class="icon material-symbols-outlined">handyman</span>模块设置<div class="spinner"></div></button>
          <button class="btn" data-type="profile"><span class="icon material-symbols-outlined">man</span>设置配置文件<div class="spinner"></div></button>
          <button class="btn" data-type="ctrl"><span class="icon material-symbols-outlined">settings</span>无 Zygisk 模式 <div class="spinner"></div></button>
          <button class="btn" data-script="override_lineage.sh" data-type="lineage"><span class="icon material-symbols-outlined">visibility_off</span>欺骗 Lineage 属性<div class="spinner"></div></button>
        </div>
      </div>
      
      <div class="button-group">
        <h3 class="group-title">工具箱</h3>
        <div class="button-grid">
          <button class="btn" data-type="utility"><span class="icon material-symbols-outlined">dynamic_form</span>实用工具箱<div class="spinner"></div></button>
          <button class="btn" data-script="status" data-type="status"><span class="icon material-symbols-outlined">verified</span>完整性状态<div class="spinner"></div></button>
        </div>
      </div>
      
      <div class="button-group">
        <h3 class="group-title">自动驾驶</h3>
        <div class="button-grid">
          <button class="btn" data-type="pilot"><span class="icon material-symbols-outlined">key robot_2 rocket_launch</span>自动更新 Keybox 和指纹<div class="spinner"></div></button>
        </div>
      </div>

      <div class="button-group">
        <h3 class="group-title">检测修复</h3>
        <div class="button-grid">
          <button class="btn" data-type="hash"><span class="icon material-symbols-outlined">threat_intelligence</span>修复异常启动哈希<div class="spinner"></div></button>
          <button class="btn" data-script="resetprop.sh" data-type="resetprop"><span class="icon material-symbols-outlined">drag_click</span>隐藏 PIF 检测<div class="spinner"></div></button>
<!--          <button class="btn" data-script="resetprop.sh" onclick="ksu.exec(`su -c 'for p in $(getprop | grep -E pphooks\|gphooks\|pihook\|pixelprops\|gms\|pi | sed -E s/^\\[\\(.*\\)\\]:.*/\\1/); do resetprop -p -d $p; done; pm list packages | grep -q com.reveny.nativecheck && am force-stop com.reveny.nativecheck'`)"><span class='icon material-symbols-outlined'>drag_click</span>隐藏 PIF Hook 检测<div class='spinner'></div></button>
-->
          <button class="btn" data-type="propspoofer"><span class="icon material-symbols-outlined">shield</span>属性欺骗器<div class="spinner"></div></button>
          <button class="btn" data-type="scanner"><span class="icon material-symbols-outlined">microbiology</span>扫描标记的应用 <div class="spinner"></div></button>
        </div>
      </div>
      
      <div class="button-group">
        <h3 class="group-title">隐藏功能</h3>
        <div class="button-grid">
          <button class="btn" data-script="hma.sh" data-type="hma"><span class="icon material-symbols-outlined">adb</span>注入 HMA 模板<div class="spinner"></div></button>
          <button class="btn" data-type="hide"><span class="icon material-symbols-outlined">visibility_off</span>隐藏可疑文件 <div class="spinner"></div></button>
        </div>
      </div>

      <div class="button-group">
        <h3 class="group-title">Play Integrity 修复</h3>
        <div class="button-grid">
          <button class="btn" data-type="piffork"><span class="icon material-symbols-outlined">shop</span>欺骗菜单<div class="spinner"></div></button>
          <button class="btn" data-script="kill" onclick="ksu.exec(`sh -c 'am force-stop com.google.android.gms.unstable 2>/dev/null || true; am force-stop com.android.vending' 2>/dev/null || true`)"><span class="icon material-symbols-outlined">swords</span>停止 GMS 进程<div class="spinner"></div></button>
          <button class="btn" data-type="pif"><span class="icon material-symbols-outlined">wand_stars</span>设置自定义指纹 <div class="spinner"></div></button>
          <button class="btn" data-type="vending"><span class="icon material-symbols-outlined">build_circle</span>修复设备未认证 <div class="spinner"></div></button>
        </div>
      </div>

      <div class="button-group">
        <h3 class="group-title">自定义 Tricky Store</h3>
        <div class="button-grid">
          <button class="btn" data-type="patch"><span class="icon material-symbols-outlined">android</span>自定义补丁 <div class="spinner"></div></button>
          <button class="btn" data-type="user"><span class="icon material-symbols-outlined">android</span>黑名单目标 <div class="spinner"></div></button>
        </div>
      </div>
      
      <div class="button-group">
        <h3 class="group-title">Keybox 中心</h3>
        <div class="button-grid">
          <button class="btn" data-script="key.sh" data-type="keybox"><span class="icon material-symbols-outlined">deployed_code_update</span>设置有效 Keybox<div class="spinner"></div></button>
          <button class="btn" data-script="aosp" onclick='ksu.exec("sh -c \"cp /data/adb/modules/playintegrityfix/keybox/aosp_keybox.xml /data/adb/tricky_store/keybox.xml 2>/dev/null || true\"")'><span class="icon material-symbols-outlined">adb</span>设置 AOSP Keybox<div class="spinner"></div></button>
          <button class="btn" data-type="xml"><span class="icon material-symbols-outlined">key</span>Key 模拟器 <div class="spinner"></div></button>
          <button class="btn" data-type="tee"><span class="icon material-symbols-outlined">key</span>目标模拟器 <div class="spinner"></div></button>
        </div>
      </div>
      
      <div class="button-group">
        <h3 class="group-title">小白指南</h3>
        <div class="button-grid">
          <button class="btn" data-script="assistant" data-type="assistant"><span class="icon material-symbols-outlined">help</span>咨询助手<div class="spinner"></div></button>
        </div>
      </div>
      
      <div class="button-group">
        <h3 class="group-title">社区与支持</h3>
        <div class="button-grid">
          <button class="btn" data-script="support" data-type="support"><span class="icon material-symbols-outlined">volunteer_activism</span>支持开发者 <div class="spinner"></div></button>
          <button class="btn" data-script="report" data-type="report"><span class="icon material-symbols-outlined">report</span>报告问题<div class="spinner"></div></button>
        </div>
      </div>
      
      <div class="button-group">
        <h3 class="group-title">清理与 SELinux</h3>
        <div class="button-grid">
          <button class="btn" data-script="selinux" onclick="ksu.exec('setenforce 1')"><span class="icon material-symbols-outlined">bolt</span>欺骗 SELinux<div class="spinner"></div></button>
          <button class="btn" data-script="cache" data-type="cache"><span class="icon material-symbols-outlined">mop</span>清除应用存储 <div class="spinner"></div></button>
        </div>
      </div>
      
      <div class="button-group">
        <h3 class="group-title">ZygiskNext 与 Shamiko</h3>
        <div class="button-grid">
          <button class="btn" data-script="start" onclick="ksu.exec('[ -d /data/adb/Box-Brain ] && touch /data/adb/shamiko/whitelist || [ -d /data/adb/zygisksu ] && touch /data/adb/zygisksu/denylist_enforce')"><span class="icon material-symbols-outlined">toggle_on</span>启用白名单模式 <div class="spinner"></div></button>
          <button class="btn" data-script="zygisknext" onclick="ksu.exec(`sh -c 'if [ -d /data/adb/zygisksu ]; then echo 0 > /data/adb/zygisksu/denylist_enforce; echo 0 > /data/adb/zygisksu/linker; echo 0 > /data/adb/zygisksu/memory_type; echo 0 > /data/adb/zygisksu/klog; fi'`).catch(()=>{})"><span class="icon material-symbols-outlined">bolt</span>重置 ZygiskNext <div class="spinner"></div></button>
        </div>
      </div>

      <div class="button-group">
        <h3 class="group-title">自定义 ROM 欺骗</h3>
        <div class="button-grid">
          <button class="btn" data-script="spoofing" data-type="spoofing"><span class="icon material-symbols-outlined">pause bolt resume</span>启用/禁用 ROM 内置欺骗<div class="spinner"></div></button>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-backdrop" class="hidden">
    <div id="modal-content">
      <div id="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close">×</button>
      </div>
      <div id="modal-output"></div>
    </div>
  </div>

<script src="script.js"></script>
</script>
</body>
</html>
