<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntegrityBox Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
:root {
  --bg: #1f2233;
  --fg: #e6e6e6;
  --accent: #1592FF;
  --panel-bg: #232637D9;
  --panel2: #1a1c29;
  --btn-hover: #2d3240F2;
  --card-border: #ffffff0D;
  --radius: 16px;
}

/* GLOBAL */
body {
  margin:0;
  font-family:-apple-system,Roboto,sans-serif;
  background: linear-gradient(135deg,#1f2233,#14172b);
  color: var(--fg);
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

/* HEADER */
.header {
  padding:1rem 1rem 0.2rem 1rem;
  text-align:center;
}
.header h1 {
  font-size:2rem;
  font-weight:700;
  color:var(--accent);
  text-shadow:0 0 18px rgba(21,146,255,0.45);
  margin:0;
}
.header p {
  margin:0.2rem 0 0.8rem 0;
  font-size:0.9rem;
  opacity:0.7;
}

/* CATEGORY TABS */
.tabs {
  display:flex;
  justify-content:center;
  gap:0.6rem;
  margin:0 1rem 1rem 1rem;
  flex-wrap:wrap;
}
.tab {
  padding:0.6rem 1rem;
  border-radius:var(--radius);
  background:var(--panel2);
  border:1px solid var(--card-border);
  cursor:pointer;
  font-weight:600;
  transition:0.2s;
}
.tab.active { background:var(--accent); color:#fff; }
.tab:hover { background:var(--btn-hover); }

/* SEARCH */
.search-bar {
  margin:0 1rem 0.5rem 1rem;
  padding:0.8rem 1rem;
  border-radius:var(--radius);
  background:#1b1d2a;
  border:1px solid var(--card-border);
  color:var(--fg);
  font-size:1rem;
  outline:none;
  box-shadow:0 0 16px rgba(21,146,255,0.18);
  position: sticky;
  top: 0;
  z-index: 10;
}

/* FAQ PANEL */
.faq-panel {
  display:flex;
  flex-direction:column;
  margin:0 1rem 1rem 1rem;
  gap:0.6rem;
  transition: max-height 0.3s ease, opacity 0.3s ease;
  overflow:hidden;
  max-height:500px;
  opacity:1;
}
.faq-panel.minimized { max-height:0; opacity:0; }

/* QUESTIONS SCROLL */
.questions {
  overflow-y:auto;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:0.6rem;
  max-height:250px;
}

/* QUESTION BUTTONS */
.q-btn {
  padding:0.9rem 1.2rem;
  border-radius:var(--radius);
  background:var(--panel2);
  border:1px solid var(--card-border);
  cursor:pointer;
  transition:0.25s;
}
.q-btn:hover { background:var(--btn-hover); transform:scale(1.02); }

/* TOGGLE BUTTON */
.toggle-btn {
  margin:0 1rem;
  padding:0.5rem 1rem;
  border:none;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  border-radius:var(--radius);
  cursor:pointer;
  transition:0.2s;
}
.toggle-btn:hover { background:#0f74d1; }

/* CHAT AREA */
.chat-area {
  flex:1;
  margin:0 1rem;
  padding:1rem;
  background: #1a1c29;
  border-radius:var(--radius);
  border:1px solid var(--card-border);
  box-shadow:0 0 20px rgba(0,153,255,0.12);
  display:flex;
  flex-direction:column;
  gap:0.7rem;
  overflow-y:auto;
  scroll-behavior: smooth;
}
.user-msg {
  align-self:flex-end;
  max-width:78%;
  padding:0.9rem 1rem;
  background:var(--accent);
  color:#fff;
  border-radius:var(--radius) var(--radius) 4px var(--radius);
  animation:slideRight 0.3s ease;
}
.bot-msg {
  align-self:flex-start;
  max-width:78%;
  padding:0.9rem 1rem;
  background:#2b2f45;
  border:1px solid var(--card-border);
  border-radius:var(--radius) var(--radius) var(--radius) 4px;
  animation:slideLeft 0.3s ease;
}
.typing {
  align-self:flex-start;
  background:#2b2f45;
  padding:0.7rem 1rem;
  border-radius:var(--radius);
  border:1px solid var(--card-border);
  display:flex; gap:4px;
}
.typing-dot { width:7px; height:7px; border-radius:50%; background:white; opacity:0.4; animation:blink 1.4s infinite;}
.typing-dot:nth-child(2){animation-delay:0.2s;}
.typing-dot:nth-child(3){animation-delay:0.4s;}

@keyframes slideLeft {from{opacity:0;transform:translateX(-10px);}to{opacity:1;}}
@keyframes slideRight {from{opacity:0;transform:translateX(10px);}to{opacity:1;}}
@keyframes blink {0%,80%{opacity:0;}40%{opacity:1;}}

/* INPUT BAR */
.input-bar {
  display:flex;
  padding:0.7rem 1rem;
  margin:1rem;
  gap:0.5rem;
  border-radius:var(--radius);
  background:var(--panel2);
  align-items:center;
}
.input-bar input {
  flex:1;
  padding:0.7rem 1rem;
  border-radius:var(--radius);
  border:1px solid var(--card-border);
  outline:none;
  background:#1b1d2a;
  color:var(--fg);
  font-size:1rem;
}
.input-bar button {
  padding:0.6rem 1rem;
  border-radius:var(--radius);
  border:none;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  font-weight:600;
  transition:0.2s;
}
.input-bar button:hover { transform:scale(1.05); }

/* FOOTER */
.contact-footer {
  text-align:center;
  margin:1rem;
  opacity:0.85;
}
.contact-footer a { color:var(--accent); font-weight:700; }

/* SCROLLBAR */
.chat-area::-webkit-scrollbar { width:8px; }
.chat-area::-webkit-scrollbar-thumb { background:rgba(21,146,255,0.3); border-radius:4px; }
.chat-area::-webkit-scrollbar-track { background:transparent; }
.questions::-webkit-scrollbar { width:6px; }
.questions::-webkit-scrollbar-thumb { background:rgba(21,146,255,0.3); border-radius:4px; }
.questions::-webkit-scrollbar-track { background:transparent; }

</style>
</head>
<body>

<div class="header">
  <h1>IntegrityBox 助手</h1>
  <p>在下方选择问题或手动提问</p>
</div>

<button class="toggle-btn" id="toggleBtn">最小化常见问题</button>

<div class="faq-panel" id="faqPanel">
  <div class="tabs" id="tabs"></div>
  <input id="search" class="search-bar" placeholder="搜索问题..."/>
  <div class="questions" id="questions"></div>
</div>

<div class="chat-area" id="chat"></div>

<div class="input-bar">
  <input id="userInput" type="text" placeholder="输入你的问题...">
  <button onclick="sendMessage()">发送</button>
</div>

<div class="contact-footer">
  没找到你需要的内容？ <a href="#" onclick="openLink('https://t.me/TempMeow')">联系开发者</a>
</div>

<script>
const faq = {
  "常规": [
    { q:"有什么要求？", a:"这取决于你的 ROM，有时不需要 Zygisk。无论如何，以下是推荐在所有设备上通用的模块： <p> 1. Tricky Store <p/> <p> 2. Integrity Box <p/> <p> 3. Zygisk Next <p/> <p> 你可以通过打开 Integrity Box 的 WebUI 来下载它们 <p/> <p> <p/> <p> 模块设置 > 下载推荐模块 <p> 。 <p/> 回到模块选项卡并点击 Integrity Box 的操作按钮。模块将下载到 /sdcard/Downloads/IntegrityModules 文件夹中<p/>" },
    { q:"为什么我的设备通过了 Play Integrity 但应用内仍显示‘设备认证/许可失败’？", a:"通过 Play Integrity 并不总是意味着设备已认证。 <p> Google Play 认证/许可检查可能还需要有效的 GMS 认证、正确的 vendor 分区签名、有效的证明密钥和真实的 vendor keybox。 <p> 如果这些被篡改（由于自定义 ROM、修改后的固件或欺骗），检查“认证设备状态”的应用可能仍然失败，即使完整性测试通过了。" },
    { q:"修复设备未认证", a:"你至少需要通过 DEVICE INTEGRITY，然后打开 WebUI，点击“修复设备未认证”按钮，请记住你的 root 和 zygisk 应该正确隐藏，否则将无法工作。" },
    { q:"我不知道如何使用 WebUI", a:"兄弟我懂你，如果你使用的是 Magisk，你必须安装 KSU WebUI 应用并授予其 root 权限，才能使用已安装模块的 WebUI 功能。 <p> 如果你想了解特定设置的用法，请查看 Integrity Box 的 GitHub 仓库，那里有详细的解释。 <p\>" },
    { q:"指纹不起作用", a:"打开 WebUI，进入“模块设置”，启用“KILL SWITCH”开关并重启设备。" },
    { q:"Magisk 提示？", a:"如果你使用的是 Magisk，请确保禁用 Magisk 内置的 Zygisk 并将你的银行应用添加到排除列表（Denylist）。GMS 和 Play 服务进程将通过 Integrity Box 自动添加。还要通过在 Magisk 设置中更改其名称来隐藏你的 Magisk 应用..." }
  ],
  "完整性": [
    { q:"为什么 Strong Play Integrity 失败了？", a:"请确保你已安装推荐的模块。请记住，并非所有 ROM 都能通过 Play Integrity，无论你是否禁用了 ROM 内置的 GMS 欺骗或更新了 keybox/指纹。你也可以尝试将你的 Play 商店版本降级到 v40.0.13-23 <p> 当引导加载程序（Bootloader）已解锁（未欺骗）或硬件 keybox 无效时，Play Integrity 会失败。还要检查是否存在冲突的模块。有时使用过多的模块/LSPosed 应用会暴露 root 环境。 <p/>" },
    { q:"为什么即使 Play Integrity 显示 Strong，某些银行应用仍然无法运行？", a:"因为许多银行应用实现了自己的 root/环境检测，超出了 Play Integrity 的范围。 <p> 他们可以检查系统属性（如 ro.debuggable）、root 二进制文件的存在、SELinux 状态、异常的文件系统痕迹、自定义内核或恢复标记、调试构建标志和标记的应用等。 <p> 即使 Integrity-Box 修复了上述提到的大部分内容，你仍然需要 root 隐藏工具（如 HideMyApplist、Denylist 等）、清理存储（没有 TWRP 文件夹，看不到 root 文件），有时还需要一个纯净的 ROM（官方或接近官方）以获得最佳结果。" },
    { q:"我通过了 Play Integrity，但 Google Pay / Wallet / UPI 等应用仍然无法工作，为什么？", a:"那是因为通过 Play Integrity 只是其中一方面。 <p> 许多“支付/钱包”应用会检查额外的信号，如引导加载程序锁定状态、vendor keybox 有效性、硬件支持的证明或特定于应用的额外检查。 <p> 此外，如果你的 ROM 修补或欺骗了 GMS（Google 移动服务）并使用自定义 keybox/keystore，它可能与尝试欺骗的模块（如 Tricky Store）发生冲突，有时甚至与 ROM 级别的欺骗发生冲突。" },
    { q:"我的设备运行的是自定义 ROM，IntegrityBox 能可靠工作吗？", a:"可以，但请记住自定义 ROM 会让事情变得更困难。 <p> 许多自定义 ROM 带有自己对系统属性、keybox、GMS 欺骗或安全补丁元数据的修改。这些更改通常会干扰欺骗模块。 <p> 对于自定义 ROM：首先禁用或清理任何预置的欺骗或 keybox 技巧，尽可能恢复官方属性，然后应用 Integrity-Box + Tricky Store。只有这样才尝试通过 Device/Strong 完整性。" },
    { q:"我应该将哪些模块与 Integrity-Box 结合使用以最大限度地提高银行应用的兼容性？", a:"通常推荐的配置是： <p> • Integrity-Box（用于属性/keybox 欺骗） <p> • 纯净的 zygote 注入层（例如 Zygisk Next） <p> • DenyList / 隐藏 Magisk 管理器（使 root 管理器应用不可见）或使用欺骗版本的 KSU 管理器 <p> • 在刷入/修补后清除 Play 商店 + Google 服务数据 <p> • 重启并使用 Play Integrity 检查器/应用进行测试 <p> 这种组合通常建议用于自定义 ROM 上的已 root 手机，以通过检查并运行银行/UPI 应用。" },
    { q:"在通过所有完整性检查后，我的银行应用仍然显示‘检测到 root’，还有什么额外措施可以提供帮助？", a:"以下是通常推荐的额外措施： <p> • 移除/重命名 root 管理器应用（Magisk Manager 等），或保持它们隐藏。 <p> • 清除残留痕迹：TWRP 文件夹、恢复备份、存储中残留的 root 应用文件。 <p> • 使用 DenyList 或隐藏 Magisk + 包含银行应用。 <p> • 对于自定义 ROM：避免使用与你的模块冲突的预置 ROM 级欺骗。 <p> • 使用 MEOW 2.0 HMA 配置。" },
    { q:"更新 Google Play 服务或 Play 商店会破坏欺骗模块吗？", a:"经常会。Google Play 服务更新可能会重新验证密钥、vendor 证书或完整性元数据，这可能会使欺骗或 keybox 技巧失效。 <p> 在此类更新后，你可能需要重新应用欺骗或重新刷入模块以保留欺骗的完整性。许多论坛用户报告在主要的 Play 服务更新后需要重新欺骗。" },
    { q:"如何在应用 IntegrityBox 和欺骗之前完全清理旧的 root 痕迹？", a:"建议的清理步骤： <p> • 卸载所有 root 管理器应用和模块。 <p> • 移除 /sdcard/TWRP 等文件夹。 <p> • 清除 Google 服务和银行应用的缓存/数据。 <p> • 重启。 <p> • 然后应用推荐的模块。 <p> 许多 XDA 用户确认这种完全清理 + 重新安装通常可以解决持久的 root 检测问题。" },
    { q:"为什么我的设备在欺骗和正确隐藏 root 后仍然显示 Basic 完整性？", a:"如果你的安卓版本是 A13 或更高，请使用 SUPREME 配置文件。如果是 A12 或更低，请使用 LEGACY 配置文件并降级 Play 商店版本（v40.xx）。" },
    { q:"如果在安装 IntegrityBox 后仍然无法通过 Strong Integrity 怎么办？", a:"通过 Strong Integrity 还可以取决于硬件 keybox 的有效性、引导加载程序状态、vendor 分区补丁以及冲突的模块。 <p> 如果你在自定义 ROM 上或启用了 SELinux/permissive，或者如果其他模块篡改了系统属性，仅靠 IntegrityBox 可能是不够的。" },
    { q:"将 root 隐藏模块与 Integrity-Box 一起使用会提高银行应用的成功率吗？", a:"通常是的，许多用户报告将 IntegrityBox 与 root 隐藏工具结合使用有助于避免被银行应用检测。 <p> 然而，root 隐藏 + 欺骗是一场猫鼠游戏，可能并不在所有地方都有效。" },
    { q:"为什么即使 Play Integrity 显示 '通过'，银行或钱包应用仍然会检测到 root？", a:"因为 Play Integrity 只是检测的一部分。 <p> 许多应用还会进行运行时 root/环境检测。如果 root 隐藏不完全或其他模块留下了痕迹（例如自定义恢复文件夹、SELinux 标志、调试属性），应用仍可能检测到篡改。" }
  ],
  "好奇心": [
    { q:"为什么在安卓更新或 ROM 更新后，我必须重新应用欺骗？", a:"因为系统更新或 ROM 更改经常会覆盖或重置关键系统文件和安全元数据。 <p> 安全补丁日期、vendor 分区数据、keybox 有效性和构建属性可能会被重置。 <p> 因此，Integrity-Box 或其他修复程序所做的欺骗会变得无效，你需要在每次重大更新后重新欺骗、重新应用设置或重新测试以确保兼容性。" },
    { q:"是否能保证 IntegrityBox 会让所有应用完美运行？", a:"不。没有普遍的保证。 <p> 现代检测系统（如更新的 Play Integrity、应用的自定义原生检查、引导加载程序解锁检测、硬件证明）不断发展。 <p> IntegrityBox 增加了通过完整性检查的机会，但由于变量（设备型号、ROM、内核、其他模块、特定于应用的检查），它始终是一个“尽力而为”的解决方案。" },
    { q:"如果欺骗失败，如何调试，从哪里开始？", a:"从检查以下内容开始： <p> • 设备属性 (ro.build.*) 是否已正确欺骗？ <p> • keybox/keystore 是否有效？ <p> • SELinux 是否为 enforcing 模式？ <p> • 是否安装了任何冲突的 root 隐藏或系统修改模块？ <p> • 在应用模块后及测试应用前，是否已清除缓存数据（Play 商店、Google 服务）？ <p> • 你是否使用的是最新的模块版本和适用于你的 ROM/内核的正确配置？ <p> 这种系统的检查有助于隔离破坏完整性或导致检测的原因。" },
    { q:"为了隐藏银行应用，使用内核级 root（如 KernelSU）是否比用户空间 root（Magisk）更好？", a:"许多 XDA 用户报告内核级 root 解决方案（如 KernelSU）往往更隐蔽，因为它们避开了某些检测到的用户空间痕迹（root 二进制文件、Magisk 目录等）。 <p> 结合 IntegrityBox，KernelSU 产生的检测可能比传统的 Magisk 设置更少。但结果因设备、ROM 和内核补丁而异。" },
    { q:"每台设备/ROM 对 IntegrityBox 的支持都一样吗？", a:"不。结果可能因设备供应商、安卓版本、ROM、SELinux 模式、内核、vendor 分区更改以及你的固件离官方有多近而异。 <p> 自定义 ROM 或重度修改会降低干净通过的机会。" },
    { q:"我应该避免哪些模块以减少与 IntegrityBox 的冲突？", a:"避免那些重度修改系统属性、SELinux 设置、内核行为、root 检测钩子或 GMS/Play 服务篡改的模块。以及那些修改 Tricky Store 的 target.txt 的模块。<p> 此类模块可能与完整性欺骗冲突，并导致检测失败或引导问题。" },
    { q:"使用 IntegrityBox 是永久性的修复，还是我需要在更新（ROM/内核）后重新配置？", a:"不能保证是永久性的。 <p> 系统更新、内核或 vendor 更改、ROM 更新经常会破坏欺骗或 keybox 有效性；你可能需要在更新后重新应用或重新配置 Play Integrity 相关内容。" },
    { q:"这会弄坏应用吗？", a:"不。" }
  ],
};

/* 关键词过滤器 */
const filters = {
  "root": "Root 检测信息：Integrity-Box 自身无法完全隐藏 root。",
  "useless": "😂😂😂",
  "telegram": "查看我们的更新频道：https://t.me/MeowRedirect",
  "hi": "你好，兄弟，请选择你的问题，以便我为你提供帮助",
  "hello": "你好，兄弟，请选择你的问题，以便我为你提供帮助",
  "thank": "不客气，很高兴能帮到你 😊",
  "pif": "从 v28 开始，使用 Integrity Box 时不需要 PIF",
  "bug": "你可以在这里报告错误：https://t.me/TempMeow"
};


let currentCategory = "General";

/* BUILD TABS */
const tabContainer = document.getElementById("tabs");
Object.keys(faq).forEach(cat=>{
  const t = document.createElement("div");
  t.className="tab"+(cat===currentCategory?" active":"");
  t.textContent=cat;
  t.onclick=()=>{ currentCategory=cat; buildTabs(); buildQuestions(); };
  tabContainer.appendChild(t);
});
function buildTabs(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active", t.textContent===currentCategory);
  });
}

/* BUILD QUESTIONS */
const faqPanel = document.getElementById("faqPanel");
function buildQuestions(filter=""){
  const container = document.getElementById("questions");
  container.innerHTML="";
  faq[currentCategory].forEach(item=>{
    if(filter && !item.q.toLowerCase().includes(filter.toLowerCase())) return;
    const el = document.createElement("div");
    el.className="q-btn";
    el.textContent=item.q;
    el.onclick=()=> {
      ask(item.q,item.a);
      minimizeFAQ();
    };
    container.appendChild(el);
  });
}
buildQuestions();

/* SEARCH */
document.getElementById("search").addEventListener("input", e=>{
  const val = e.target.value.trim();
  buildQuestions(val);
});

/* CHAT */
const chat = document.getElementById("chat");

function ask(q,a){
  appendBubble(q,"user-msg");
  scrollChat();
  showTyping(()=> appendBubble(a,"bot-msg"));
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  appendBubble(text, "user-msg");
  scrollChat();

  // keyword filters
  for (const key in filters) {
    if (text.toLowerCase().includes(key)) {
      showTyping(() => appendBubble(filters[key], "bot-msg"));
      return;
    }
  }

  const inputWords = text
    .toLowerCase()
    .split(/\s+/)
    .filter(w => w.length > 3);

  if (!inputWords.length) {
    showTyping(() =>
      appendBubble(
        "Please type a little more detail so I can help 🙂",
        "bot-msg"
      )
    );
    return;
  }

  let bestMatch = null;
  let bestScore = 0;

  for (const cat in faq) {
    for (const item of faq[cat]) {
      const qWords = item.q.toLowerCase().split(/\s+/);

      let score = 0;
      inputWords.forEach(w => {
        if (qWords.some(qw => qw.includes(w) || w.includes(qw))) {
          score++;
        }
      });

      if (score > bestScore) {
        bestScore = score;
        bestMatch = item;
      }
    }
  }

  if (bestMatch && bestScore >= 2) {
    showTyping(() => appendBubble(bestMatch.a, "bot-msg"));
    return;
  }

  // suggestions
  let suggestions = [];

  for (const cat in faq) {
    for (const item of faq[cat]) {
      const qWords = item.q.toLowerCase().split(/\s+/);
      if (
        inputWords.some(w =>
          qWords.some(qw => qw.includes(w) || w.includes(qw))
        )
      ) {
        suggestions.push(item.q);
      }
    }
  }

  if (suggestions.length) {
    showTyping(() =>
      appendBubble(
        "Did you mean:\n- " +
          [...new Set(suggestions)].slice(0, 3).join("\n- "),
        "bot-msg"
      )
    );
  } else {
    showTyping(() =>
      appendBubble(
        "I couldn't find an exact match. Please select a FAQ above or contact the developer.",
        "bot-msg"
      )
    );
  }
}

function appendBubble(text, cls) {
  const el = document.createElement("div");
  el.className = cls;

  if (Array.isArray(text)) {
    text.forEach(p => {
      const pEl = document.createElement("p");
      pEl.textContent = p;
      el.appendChild(pEl);
    });
  } else {
    el.innerHTML = text.replace(/\n/g, "<br>");
  }

  chat.appendChild(el);
  scrollChat();
}

function showTyping(callback){
  const t = document.createElement("div");
  t.className="typing";
  t.innerHTML=`<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
  chat.appendChild(t);
  scrollChat();
  setTimeout(()=>{ t.remove(); callback(); scrollChat(); },900);
}

function scrollChat(){ chat.scrollTop = chat.scrollHeight; }

/* TOGGLE FAQ PANEL */
const toggleBtn = document.getElementById("toggleBtn");
toggleBtn.onclick = ()=> {
  faqPanel.classList.toggle("minimized");
  toggleBtn.textContent = faqPanel.classList.contains("minimized") ? "Show Frequently Asked Questions" : "Minimize Questions";
}
function minimizeFAQ(){
  faqPanel.classList.add("minimized");
  toggleBtn.textContent = "Show Frequently Asked Questions";
}

/* LINK OPEN */
function openLink(url){
  try { ksu.exec(`am start -a android.intent.action.VIEW -d ${url}`); alert("Opening…"); }
  catch(e){ alert("Unable to open link."); }
}
</script>
